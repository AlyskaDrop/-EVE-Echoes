<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Вход | Weeping Ghosts</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700;900&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <canvas id="starfield"></canvas>
  <div class="scanline-overlay"></div>

  <div class="page-wrap">
    <header class="site-header">
      <div class="header-inner">
        <a class="logo" href="index.html">Weeping <span>Ghosts</span></a>
        <div class="auth-nav">
          <a href="index.html"    class="btn btn-ghost btn-sm">Главная</a>
          <a href="register.html" class="btn btn-sm">Регистрация</a>
        </div>
      </div>
    </header>

    <div class="auth-page">
      <div class="auth-panel">
        <div class="auth-logo">
          <div class="auth-corp">Weeping Ghosts</div>
          <div class="auth-sub">Авторизация пилота</div>
        </div>

        <form id="loginForm" novalidate>
          <div class="form-row">
            <label for="f-login">Логин</label>
            <input type="text" id="f-login" name="login" required
                   autocomplete="username" placeholder="your_callsign" />
          </div>
          <div class="form-row">
            <label for="f-pass">Пароль</label>
            <input type="password" id="f-pass" name="password" required
                   autocomplete="current-password" placeholder="••••••••" />
          </div>
          <div class="form-row">
            <label class="form-check">
              <input type="checkbox" id="f-remember" name="remember" />
              <span>Запомнить меня на этом устройстве</span>
            </label>
          </div>
          <button class="btn btn-block" type="submit">Войти</button>
        </form>

        <div class="msg" id="loginMsg"></div>

        <div class="form-footer">
          Нет аккаунта? <a href="register.html">Зарегистрироваться</a>
        </div>
      </div>
    </div>

    <footer class="site-footer">
      <p>© 2026 Weeping Ghosts Corporation</p>
    </footer>
  </div>

  <script src="auth.js"></script>
  <script src="script.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      await WG.redirectIfAuth('dashboard.html');
    });

    document.getElementById('loginForm').addEventListener('submit', async function (e) {
      e.preventDefault();
      const msg = document.getElementById('loginMsg');
      const result = await WG.login({
        login:    this.login.value,
        password: this.password.value,
        remember: this.remember.checked
      });
      msg.className = 'msg show ' + (result.ok ? 'success' : 'error');
      msg.textContent = result.ok
        ? 'Авторизация успешна. Загружаю кабинет...'
        : result.error;
      if (result.ok) setTimeout(() => window.location.href = 'dashboard.html', 900);
    });
  </script>
</body>
</html>
